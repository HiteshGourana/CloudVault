# ============================================================
# alembic.ini
# ────────────────────────────────────────────────────────────
# Alembic configuration for CloudVault.
#
# Run from the project root (CloudVault/):
#   alembic upgrade head
#   alembic revision --autogenerate -m "description"
#   alembic downgrade -1
#
# The DATABASE_URL is NOT hardcoded here.
# It is loaded dynamically in database/migrations/env.py
# from the Pydantic Settings (which reads from .env).
# ============================================================

[alembic]
# Path to the migration scripts directory (relative to this file).
script_location = database/migrations

# Python path for alembic to find the project source.
# Ensures `from backend.core.config import settings` works inside env.py.
prepend_sys_path = .

# Template for new migration file names.
# Format: YYYY-MM-DD_HH-MM-<slug>.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Truncate long migration descriptions in filenames.
truncate_slug_length = 40

# Timezone for timestamps in migration filenames.
timezone = UTC

# ── SQLAlchemy ───────────────────────────────────────────────
# Left empty intentionally.
# The URL is set programmatically in database/migrations/env.py
# so it is always read from environment variables, never hardcoded.
sqlalchemy.url =

# ── Logging ─────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
